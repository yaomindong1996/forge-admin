server {
    listen 80;
    server_name localhost;

    # Docker 内置 DNS；仅用于可选上游（如 forge-report）延迟解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 带内容哈希的构建资源可长期缓存；文件不存在时必须返回 404，不能回退到 HTML。
    location ^~ /forge/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML 每次重新验证，避免发布后浏览器继续引用上一版 chunk 哈希。
    location /forge/ {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /forge/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 大屏前端静态（镜像内无 report-dist 时 404；不阻塞 nginx 启动）
    location ^~ /forge-report/assets/ {
        alias /usr/share/nginx/html/report-dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /forge-report/ {
        alias /usr/share/nginx/html/report-dist/;
        index  index.html index.htm;
        try_files $uri $uri/ /forge-report/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 流程服务 API（路径更长，优先匹配）
    location /forge-api/api/flow/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-flow:8081/api/flow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端主服务 API
    location /forge-api/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        proxy_pass http://forge-admin:8580/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 大屏后端 API（可选）。默认 compose 无 forge-report 服务；
    # 必须用变量 + resolver，否则 nginx 启动时解析不到主机会直接 emerg 退出。
    location /forge-report-api/ {
        proxy_send_timeout 3000;
        proxy_read_timeout 3000;
        proxy_connect_timeout 3000;
        set $forge_report_upstream http://forge-report:8581;
        rewrite ^/forge-report-api/(.*)$ /$1 break;
        proxy_pass $forge_report_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 文件上传大小限制
    client_max_body_size 20m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
}
