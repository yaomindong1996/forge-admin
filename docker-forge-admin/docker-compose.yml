# ============================================
# Forge Admin 一键部署 Docker Compose 编排
# ============================================
# 默认从阿里云 ACR 拉取已构建镜像（linux/arm64）：
#   REG=crpi-4r4vql6tnfnjwl27.cn-guangzhou.personal.cr.aliyuncs.com/forgelab
#   forge-admin / forge-flow / forge-ui（默认 tag 1.0.0，可用环境变量覆盖）
#
# 使用方式：
#   cd docker-forge-admin
#   cp .env.example .env   # 修改配置
#   docker compose up -d   # 拉取镜像并启动（无需 --build）
#   访问 http://localhost/forge  默认账号: admin/123456
#
# 架构注意：公开镜像当前为 linux/arm64（Mac Docker Desktop 构建）。
# amd64 服务器需自行 buildx --platform linux/amd64 重编推送，或在 arm64 机器上运行。
#
# 本地源码构建（改代码时）：Dockerfile.* 仍保留，可临时加回 build，例如：
#   # build:
#   #   context: ..
#   #   dockerfile: docker-forge-admin/Dockerfile.ui
#   #   args:
#   #     VITE_BUILD_HEAP_MB: ${VITE_BUILD_HEAP_MB:-4096}
#   # 或直接：
#   docker build -f Dockerfile.admin -t forge-admin:local ..
#   docker build -f Dockerfile.flow -t forge-flow:local ..
#   docker build -f Dockerfile.ui --build-arg VITE_BUILD_HEAP_MB=4096 -t forge-ui:local ..
# 主机内存约 8G 时不要并行猛打三个镜像；UI 默认堆 4096MB，内存紧张可：
#   docker build -f Dockerfile.ui --build-arg VITE_BUILD_HEAP_MB=3072 -t forge-ui:local ..
# ============================================

services:
  # ========================
  # MySQL 数据库
  # ========================
  mysql:
    image: mysql:8.0
    container_name: forge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-forge123456}
      MYSQL_DATABASE: ${MYSQL_DB:-forge_admin}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-forge123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-network

  # ========================
  # Redis 缓存
  # ========================
  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-forge123456} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-forge123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  # ========================
  # Forge Flow 流程服务（需先于 admin 启动）
  # ========================
  forge-flow:
    image: ${FORGE_FLOW_IMAGE:-crpi-4r4vql6tnfnjwl27.cn-guangzhou.personal.cr.aliyuncs.com/forgelab/forge-flow:1.0.0}
    # 本地源码构建可临时加回：
    # build:
    #   context: ..
    #   dockerfile: docker-forge-admin/Dockerfile.flow
    container_name: forge-flow
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-forge_admin}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-forge123456}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-forge123456}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - ./application-datasource.yml:/app/application-prod.yml
      - ../forge-server/db/migration:/app/db/migration
    ports:
      - "${FLOW_PORT:-8081}:8081"
    networks:
      - forge-network

  # ========================
  # Forge Admin 主服务
  # ========================
  forge-admin:
    image: ${FORGE_ADMIN_IMAGE:-crpi-4r4vql6tnfnjwl27.cn-guangzhou.personal.cr.aliyuncs.com/forgelab/forge-admin:1.0.0}
    # 本地源码构建可临时加回：
    # build:
    #   context: ..
    #   dockerfile: docker-forge-admin/Dockerfile.admin
    container_name: forge-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      forge-flow:
        condition: service_started
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-forge_admin}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-forge123456}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-forge123456}
      FLOW_CLIENT_URL: ${FLOW_CLIENT_URL:-http://forge-flow:8081}
      FORGE_CRYPTO_BOOTSTRAP_ENABLED: ${FORGE_CRYPTO_BOOTSTRAP_ENABLED:-true}
      FORGE_CRYPTO_BOOTSTRAP_FILE: ${FORGE_CRYPTO_BOOTSTRAP_FILE:-/var/lib/forge/secrets/crypto.properties}
      FORGE_CRYPTO_SECRET_KEY: "${FORGE_CRYPTO_SECRET_KEY:-}"
      FORGE_CRYPTO_PERSISTENCE_ENABLED: "${FORGE_CRYPTO_PERSISTENCE_ENABLED:-}"
      FORGE_CRYPTO_PERSISTENCE_WRITE_VERSIONED: "${FORGE_CRYPTO_PERSISTENCE_WRITE_VERSIONED:-}"
      FORGE_CRYPTO_PERSISTENCE_LEGACY_READ_ENABLED: "${FORGE_CRYPTO_PERSISTENCE_LEGACY_READ_ENABLED:-}"
      FORGE_AUTH_LEGACY_CLIENT_SECRET_READ_ENABLED: ${FORGE_AUTH_LEGACY_CLIENT_SECRET_READ_ENABLED:-true}
      FORGE_CRYPTO_PERSISTENCE_LEGACY_KEY: "${FORGE_CRYPTO_PERSISTENCE_LEGACY_KEY:-}"
      FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY_ID: "${FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY_ID:-}"
      FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY: "${FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY:-}"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - crypto_secrets:/var/lib/forge/secrets
      - ./application-datasource.yml:/app/application-prod.yml
    ports:
      - "${ADMIN_PORT:-8580}:8580"
    networks:
      - forge-network

  # ========================
  # 前端 Nginx
  # ========================
  forge-ui:
    image: ${FORGE_UI_IMAGE:-crpi-4r4vql6tnfnjwl27.cn-guangzhou.personal.cr.aliyuncs.com/forgelab/forge-ui:1.0.0}
    # 本地源码构建可临时加回：
    # build:
    #   context: ..
    #   dockerfile: docker-forge-admin/Dockerfile.ui
    #   args:
    #     VITE_BUILD_HEAP_MB: ${VITE_BUILD_HEAP_MB:-4096}
    container_name: forge-ui
    restart: unless-stopped
    depends_on:
      - forge-admin
      - forge-flow
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - forge-network

# ========================
# 数据卷
# ========================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  crypto_secrets:
    driver: local

# ========================
# 网络
# ========================
networks:
  forge-network:
    driver: bridge
