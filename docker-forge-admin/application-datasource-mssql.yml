spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
          url: jdbc:sqlserver://${MSSQL_HOST:mssql}:${MSSQL_PORT:1433};databaseName=${MSSQL_DB:forge_admin};encrypt=false;trustServerCertificate=true
          username: ${MSSQL_USER:sa}
          password: ${MSSQL_PASSWORD:Forge_Sa_Passw0rd}
        lowcode:
          type: ${spring.datasource.type}
          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
          url: jdbc:sqlserver://${MSSQL_HOST:mssql}:${MSSQL_PORT:1433};databaseName=${MSSQL_DB:forge_admin};encrypt=false;trustServerCertificate=true
          username: ${MSSQL_USER:sa}
          password: ${MSSQL_PASSWORD:Forge_Sa_Passw0rd}
      hikari:
        maxPoolSize: 20
        minIdle: 10
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000
  flyway:
    enabled: ${FORGE_FLYWAY_ENABLED:false}
    locations: classpath:db/sqlserver/migration
    table: forge_schema_history
    baseline-on-migrate: true
    baseline-version: ${FORGE_FLYWAY_BASELINE_VERSION:1.0.234}
    validate-on-migrate: false

spring.data:
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:forge123456}
    timeout: 10s
    ssl.enabled: false
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}"
          database: 0
          password: ${REDIS_PASSWORD:forge123456}
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10
        threads: 16
        nettyThreads: 32

config:
  datasource:
    url: ${spring.datasource.dynamic.datasource.master.url}
    username: ${spring.datasource.dynamic.datasource.master.username}
    password: ${spring.datasource.dynamic.datasource.master.password}
    driverClassName: ${spring.datasource.dynamic.datasource.master.driverClassName}

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: full
  activity-font-name: 宋体
  label-font-name: 宋体
  annotation-font-name: 宋体
