# SQL Server 可选运行示例：复制为 application-sqlserver.yml 或通过 spring.profiles.include=sqlserver 启用。
# 默认社区安装仍使用 MySQL（application-local / application-dev）。
#
# 初始化：
#   SQLCMDPASSWORD=*** bash forge-server/scripts/db/init-db-sqlserver.sh --database forge_admin --recreate
# Flyway 增量目录：classpath:db/sqlserver/migration
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
          url: jdbc:sqlserver://${FORGE_MSSQL_HOST:127.0.0.1}:${FORGE_MSSQL_PORT:1433};databaseName=${FORGE_MSSQL_DB:forge_admin};encrypt=false
          username: ${FORGE_MSSQL_USERNAME:sa}
          password: ${FORGE_MSSQL_PASSWORD:Forge_Sa_Passw0rd}
        lowcode:
          type: ${spring.datasource.type}
          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
          url: jdbc:sqlserver://${FORGE_MSSQL_HOST:127.0.0.1}:${FORGE_MSSQL_PORT:1433};databaseName=${FORGE_MSSQL_DB:forge_admin};encrypt=false
          username: ${FORGE_MSSQL_USERNAME:sa}
          password: ${FORGE_MSSQL_PASSWORD:Forge_Sa_Passw0rd}
  flyway:
    enabled: ${FORGE_FLYWAY_ENABLED:true}
    locations: ${FORGE_FLYWAY_LOCATIONS:classpath:db/sqlserver/migration}
    table: forge_schema_history
    baseline-on-migrate: true
    baseline-version: ${FORGE_FLYWAY_BASELINE_VERSION:1.0.234}

# 全量脚本跳过 act_*/flw_*，首次启动须由引擎建表
flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: full

config:
  datasource:
    url: ${spring.datasource.dynamic.datasource.master.url}
    username: ${spring.datasource.dynamic.datasource.master.username}
    password: ${spring.datasource.dynamic.datasource.master.password}
    driverClassName: ${spring.datasource.dynamic.datasource.master.driverClassName}
