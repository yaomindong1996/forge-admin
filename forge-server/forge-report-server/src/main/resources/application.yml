server:
  port: 8581
  servlet:
    context-path: /
  undertow:
    max-http-post-size: -1
    buffer-size: 512
    direct-buffers: true
    threads:
      io: 8
      worker: 256

# 日志配置
logging:
  level:
    com.forge: @logging.level@
    org.springframework: error
    org.mybatis.spring.mapper: error
  config: classpath:logback.xml

# Spring配置
spring:
  application:
    name: forge-report
  messages:
    basename: i18n/messages
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      indent_output: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false

# MyBatisPlus配置
mybatis-plus:
  # 多包名使用
  mapperPackage: com.mdframe.forge.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.mdframe.forge.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    useGeneratedKeys: true
    defaultExecutorType: SIMPLE
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# Sa-Token 配置
# Sa-Token 配置
sa-token:
  # 使用Redis存储Session
  alone-redis:
    # Redis数据库索引（默认为0）
    database: 1
    # Redis服务器地址
    host: ${spring.data.redis.host}
    # Redis服务器连接端口
    port: ${spring.data.redis.port}
    # Redis服务器连接密码（默认为空）
    password: ${spring.data.redis.password}
    # 连接超时时间（毫秒）
    timeout: 10000

# 认证授权配置
forge:
  auth:
    api-permission-exclude-paths:
      - /auth/**
      - /report/mock/**
  crypto:
    bootstrap:
      enabled: ${FORGE_CRYPTO_BOOTSTRAP_ENABLED:true}
      file: ${FORGE_CRYPTO_BOOTSTRAP_FILE:}
    secret-key: ${FORGE_CRYPTO_SECRET_KEY:}
    persistence:
      enabled: ${FORGE_CRYPTO_PERSISTENCE_ENABLED:true}
      write-versioned: ${FORGE_CRYPTO_PERSISTENCE_WRITE_VERSIONED:false}
      legacy-read-enabled: ${FORGE_CRYPTO_PERSISTENCE_LEGACY_READ_ENABLED:true}
      legacy-key: ${FORGE_CRYPTO_PERSISTENCE_LEGACY_KEY:${FORGE_CRYPTO_SECRET_KEY:}}
      active-key-id: ${FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY_ID:}
      active-key: ${FORGE_CRYPTO_PERSISTENCE_ACTIVE_KEY:}
