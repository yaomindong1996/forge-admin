server:
  max-http-request-header-size: ${FORGE_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  port: 8081
  servlet:
    context-path: /
  # Boot 4 不再支持 Undertow；沿用请求体限制，改用 Tomcat 的有界工作线程。
  tomcat:
    max-http-form-post-size: ${FORGE_MAX_HTTP_POST_SIZE:20MB}
    max-swallow-size: ${FORGE_MAX_HTTP_POST_SIZE:20MB}
    threads:
      max: ${FORGE_HTTP_MAX_THREADS:256}
      min-spare: 10

# 引擎内部使用 Jackson 3；业务变量保持 Jackson 2，兼容已有 json 类型变量及动态表单。
flowable:
  variable-json-mapper: jackson2

logging:
  level:
    com.forge: @logging.level@
    org.springframework: error
    org.mybatis.spring.mapper: error
  config: classpath:logback.xml

spring:
  application:
    name: forge-flow-service
  profiles:
    active: dev
  # Boot 4：自定义 Executor 存在时默认不创建 applicationTaskExecutor；Flowable 8 强制依赖该 Bean
  task:
    execution:
      mode: force
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  http:
    converters:
      # 必须显式选择 Jackson 2，否则 Boot 4 默认 Jackson 3 会绕过 Forge 的字段序列化。
      preferred-json-mapper: jackson2
  jackson2:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      indent_output: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false

mybatis-plus:
  mapperPackage: com.mdframe.forge.**.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: com.mdframe.forge.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    useGeneratedKeys: true
    defaultExecutorType: SIMPLE
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    dbConfig:
      idType: ASSIGN_ID

sa-token:
  timeout: ${FORGE_AUTH_TOKEN_TIMEOUT:1800}
  active-timeout: ${FORGE_AUTH_ACTIVE_TIMEOUT:7200}
  is-concurrent: ${FORGE_AUTH_ALLOW_CONCURRENT:true}
  is-share: false
  # 同一账号最大会话数：默认 12 过小，频繁重登/多端登录/委托临时会话共存时会被堆满，
  # logoutByMaxLoginCount 会把最早的浏览器会话挤下线；调大作防御纵深
  # （根治靠 SaTokenFlowTokenProvider 的浏览器透传与委托 Token 复用）
  max-login-count: ${FORGE_AUTH_MAX_LOGIN_COUNT:100}
  is-read-header: true
  is-read-cookie: false
  alone-redis:
    database: 0
    host: ${spring.data.redis.host}
    port: ${spring.data.redis.port}
    password: ${spring.data.redis.password}
    timeout: 10000

# 多租户配置
forge:
  tenant:
    enabled: true
    column: tenant_id
    auto-detect-tenant-column: true
  flow:
    timeout:
      time-zone: ${FORGE_FLOW_TIMEOUT_TIME_ZONE:Asia/Shanghai}
    job:
      technical-identity:
        tenant-id: ${FORGE_FLOW_JOB_TENANT_ID:}
        user-id: ${FORGE_FLOW_JOB_USER_ID:}
        user-name: ${FORGE_FLOW_JOB_USER_NAME:}
        active-org-id: ${FORGE_FLOW_JOB_ACTIVE_ORG_ID:}
        active-org-name: ${FORGE_FLOW_JOB_ACTIVE_ORG_NAME:}
    overdue-reminder:
      enabled: true
      scan-interval-ms: 300000
      batch-size: 200

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

# 流程事件回调配置
flow:
  event:
    # 是否启用 Redis Pub/Sub 事件发布（需配置 spring.data.redis）
    redis-enabled: true
    # 是否启用 HTTP Webhook 回调（webhookUrl 配置在 FlowModel 中）
    webhook-enabled: true
    # Webhook 异步线程池核心数
    webhook-thread-pool-size: 4
