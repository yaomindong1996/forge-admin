# 开发环境配置
server:
  max-http-request-header-size: ${FORGE_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # 服务器的HTTP端口，默认为8080
  port: 8583
  servlet:
    # 应用的访问路径
    context-path: /
  # Boot 4 不再支持 Undertow；沿用请求体限制，改用 Tomcat 的有界工作线程。
  tomcat:
    max-http-form-post-size: ${FORGE_MAX_HTTP_POST_SIZE:20MB}
    max-swallow-size: ${FORGE_MAX_HTTP_POST_SIZE:20MB}
    threads:
      max: ${FORGE_HTTP_MAX_THREADS:256}
      min-spare: 10

# 日志配置
logging:
  level:
    com.forge: @logging.level@
    org.springframework: error
    org.mybatis.spring.mapper: error
  config: classpath:logback.xml

# Spring配置
spring:
  application:
    name: ${project.name}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  http:
    converters:
      # 必须显式选择 Jackson 2，否则 Boot 4 默认 Jackson 3 会绕过 Forge 的字段序列化。
      preferred-json-mapper: jackson2
  jackson2:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 多包名使用
  mapperPackage: com.mdframe.forge.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.mdframe.forge.**.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    useGeneratedKeys: true
    defaultExecutorType: SIMPLE
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID
# Sa-Token 配置
sa-token:
  timeout: ${FORGE_AUTH_TOKEN_TIMEOUT:1800}
  active-timeout: ${FORGE_AUTH_ACTIVE_TIMEOUT:7200}
  is-concurrent: ${FORGE_AUTH_ALLOW_CONCURRENT:true}
  is-share: false
  # 同一账号最大会话数：默认 12 过小，频繁重登/多端登录/委托临时会话共存时会被堆满，
  # logoutByMaxLoginCount 会把最早的浏览器会话挤下线；调大作防御纵深
  # （根治靠 SaTokenFlowTokenProvider 的浏览器透传与委托 Token 复用）
  max-login-count: ${FORGE_AUTH_MAX_LOGIN_COUNT:100}
  is-read-header: true
  is-read-cookie: false
  # 使用Redis存储Session
  alone-redis:
    # Redis数据库索引（默认为0）
    database: 0
    # Redis服务器地址
    host: ${spring.data.redis.host}
    # Redis服务器连接端口
    port: ${spring.data.redis.port}
    # Redis服务器连接密码（默认为空）
    password: ${spring.data.redis.password}
    # 连接超时时间（毫秒）
    timeout: 10000
sms:
  config-type: interface

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
forge:
  captcha:
    challenge-secret: ${FORGE_CAPTCHA_CHALLENGE_SECRET:}
